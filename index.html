<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>食品法規適用性儀表板</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f5f2;color:#162019;display:grid;place-items:center;min-height:100vh}main{max-width:720px;padding:32px;text-align:center}h1{font-size:28px;margin:0 0 12px}p{color:#667269}#err{color:#9b3434;white-space:pre-wrap}</style></head><body><main><h1>食品法規適用性儀表板</h1><p id="msg">正在載入最新儀表板資料…</p><p id="err"></p></main><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>(async()=>{try{const r=await fetch('./site.zip',{cache:'no-store'});if(!r.ok)throw new Error('無法讀取網站資料：HTTP '+r.status);const zip=await JSZip.loadAsync(await r.arrayBuffer());const f=zip.file('index.html');if(!f)throw new Error('site.zip 內找不到 index.html');const html=await f.async('string');const u=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));location.replace(u)}catch(e){document.getElementById('msg').textContent='儀表板載入失敗';document.getElementById('err').textContent=e.message+'\n請重新整理頁面，或到 GitHub repository 確認 site.zip 是否存在。'}})();</script></body></html>
