<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>食品法規適用性儀表板</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f5f2;color:#162019;display:grid;place-items:center;min-height:100vh}main{max-width:760px;padding:32px;text-align:center}h1{font-size:30px}p{color:#667269}#err{color:#9b3434;white-space:pre-wrap}</style></head><body><main><h1>食品法規適用性儀表板</h1><p id="msg">正在載入儀表板…</p><p id="err"></p></main><script>(async()=>{try{const files=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch('data/'+f+'?v=20260823-1745',{cache:'no-store'});if(!r.ok)throw new Error(f+' 載入失敗：HTTP '+r.status);return (await r.text()).trim()}));const b64=parts.join('');if(b64.length!==20904)throw new Error('資料長度異常：'+b64.length+' / 20904');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('瀏覽器不支援 DecompressionStream，請使用最新版 Chrome、Edge 或 Safari');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').textContent='頁面載入失敗';document.getElementById('err').textContent=String(e);}})();</script></body></html>
