<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>食品法規適用性儀表板</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f5f2;color:#162019;display:grid;place-items:center;min-height:100vh}main{max-width:760px;padding:32px;text-align:center}h1{font-size:30px}p{color:#667269}#err{color:#9b3434;white-space:pre-wrap}</style></head><body><main><h1>食品法規適用性儀表板</h1><p id="msg">正在載入儀表板…</p><p id="err"></p></main><script>(async()=>{try{const files=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch('data/'+f+'?v=20260823-1808',{cache:'no-store'});if(!r.ok)throw new Error(f+' 載入失敗：HTTP '+r.status);return (await r.text()).trim()}));const b64=parts.join('');if(b64.length!==20904)throw new Error('資料長度異常：'+b64.length+' / 20904');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('瀏覽器不支援 DecompressionStream，請使用最新版 Chrome、Edge 或 Safari');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();function transformArray(name,fn){const marker='const '+name+' = ';const ms=html.indexOf(marker);if(ms<0)throw new Error('找不到 '+name);const as=ms+marker.length;if(html[as]!=='[')throw new Error(name+' 格式異常');let depth=0,inStr=false,esc=false,ae=-1;for(let i=as;i<html.length;i++){const ch=html[i];if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='\"')inStr=false;}else{if(ch==='\"')inStr=true;else if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0){ae=i+1;break;}}}}if(ae<0)throw new Error(name+' 結尾異常');const arr=fn(JSON.parse(html.slice(as,ae)));html=html.slice(0,as)+JSON.stringify(arr)+html.slice(ae);}transformArray('RULES',arr=>arr.filter(r=>r.module!=='食品業者登錄'));transformArray('CURRENT_RULES',arr=>arr.filter(r=>r.module!=='食品業者登錄').map(r=>{r={...r};if(r.id===10001){r.start='已實施';r.note='';}if(r.module==='食品安全管制系統 HACCP'&&r.category==='熱殺菌密閉容器包裝低酸性食品及酸化食品工廠'){r.note='2026/3/17修正名稱及適用範圍。';}if(r.module==='食品安全管制系統 HACCP'&&(r.category==='食用油脂工廠'||r.category==='蛋製品工廠')){r.start='2020-07-01';r.note='';}if(r.module==='食品安全管制系統 HACCP'&&r.category==='餐盒食品工廠'){r.scale='須辦理工廠登記之餐盒食品工廠';r.start='2010-09-15';r.note='';}if(r.module==='食品安全管制系統 HACCP'&&r.category==='國際觀光旅館／五星級旅館附設餐廳'){r.start='2018-07-01';r.note='';}if(r.module==='應置衛生管理人員'&&r.category==='其他食品製造業'){r.start='2020-07-01';r.note='';}if(r.module==='應置專門職業人員'&&r.id>=10010&&r.id<=10017){r.start='2020-01-01';r.note='';}r.start=String(r.start||'').replace(/ 起完整現行範圍/g,'').replace(/ 起現行範圍/g,'').replace(/ 起兩類均已納管/g,'').replace(/ 起全面納管/g,'');return r;}));html=html.replace("const chips=['食品安全監測計畫','強制檢驗','食品安全管制系統 HACCP','應自設實驗室','應置衛生管理人員','應置專門職業人員'];","const chips=['食品安全監測計畫','強制檢驗','食品安全管制系統 HACCP','應自設實驗室','應置衛生管理人員','應置專門職業人員','應置技術證照人員'];");html=html.replace('<option value="history">歷次／分階段（含未來已公告）</option>','<option value="history">歷史沿革</option><option value="future">未來實施</option>');html=html.replace('依「現行整併／歷次分階段」模式切換','依「現行整併／歷史沿革／未來實施」模式切換');html=html.replace('歷次／分階段模式可查看尚未生效門檻','僅「未來實施」模式顯示尚未生效門檻');html=html.replace('需要追溯實施期程時，可切換至歷次／分階段。','需要追溯過去期程時切換「歷史沿革」；查看已公告但尚未生效規定時切換「未來實施」。');html=html.replace("return $('#viewMode').value==='history' ? RULES : CURRENT_RULES;","const mode=$('#viewMode').value;if(mode==='history')return RULES.filter(r=>r.status!=='未來實施');if(mode==='future')return RULES.filter(r=>r.status==='未來實施');return CURRENT_RULES;");html=html.replace("$('#modeBadge').textContent=$('#viewMode').value==='history'?'● 歷次／分階段規定':'● 現行整併規定';","const mode=$('#viewMode').value;$('#modeBadge').textContent=mode==='history'?'● 歷史沿革':mode==='future'?'● 未來實施':'● 現行整併規定';");html=html.replace("if(id==='viewMode'&&$('#viewMode').value==='current'&&$('#status').value==='未來實施')$('#status').value='';","if(id==='viewMode'){$('#status').value='';}");document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').textContent='頁面載入失敗';document.getElementById('err').textContent=String(e);}})();</script></body></html>
