<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>食品法規適用性儀表板</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f3f5f2;color:#162019;display:grid;place-items:center;min-height:100vh}main{max-width:760px;padding:32px;text-align:center}h1{font-size:30px}p{color:#667269}#err{color:#9b3434;white-space:pre-wrap}</style></head><body><main><h1>食品法規適用性儀表板</h1><p id="msg">正在載入儀表板…</p><p id="err"></p></main><script>(async()=>{try{const files=['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];const parts=await Promise.all(files.map(async f=>{const r=await fetch('data/'+f+'?v=20260823-1754',{cache:'no-store'});if(!r.ok)throw new Error(f+' 載入失敗：HTTP '+r.status);return (await r.text()).trim()}));const b64=parts.join('');if(b64.length!==20904)throw new Error('資料長度異常：'+b64.length+' / 20904');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('瀏覽器不支援 DecompressionStream，請使用最新版 Chrome、Edge 或 Safari');const ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();const marker='const RULES = ';const ms=html.indexOf(marker);if(ms<0)throw new Error('找不到法規資料區塊');const as=ms+marker.length;if(html[as]!=='[')throw new Error('法規資料格式異常');let depth=0,inStr=false,esc=false,ae=-1;for(let i=as;i<html.length;i++){const ch=html[i];if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='\"')inStr=false;}else{if(ch==='\"')inStr=true;else if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0){ae=i+1;break;}}}}if(ae<0)throw new Error('法規資料結尾異常');const rules=JSON.parse(html.slice(as,ae)).filter(r=>r.module!=='食品業者登錄');html=html.slice(0,as)+JSON.stringify(rules)+html.slice(ae);html=html.replace("const chips=['食品安全監測計畫','強制檢驗','食品安全管制系統 HACCP','應自設實驗室','應置衛生管理人員','應置專門職業人員'];","const chips=['食品安全監測計畫','強制檢驗','食品安全管制系統 HACCP','應自設實驗室','應置衛生管理人員','應置專門職業人員','應置技術證照人員'];");document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').textContent='頁面載入失敗';document.getElementById('err').textContent=String(e);}})();</script></body></html>
